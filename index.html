<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zakaria Sidi Ammi – Portfolio</title>
<meta name="description" content="Engineering portfolio of Zakaria Sidi Ammi, Tech Lead PHP/Laravel and Senior Full-Stack Engineer: measured results, case studies and tested code samples.">
<style>
:root{--navy:#0f2a3d;--navy2:#17405a;--gold:#e0a43a;--gold2:#a8701a;--goldbg:#fbf3e4;--ink:#1b2433;--muted:#5b6678;--line:#e3e8ee;--soft:#f4f7fa;--code:#0d2232;--before:#8f9aa6;--after:#b7791f}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:#d9e0e7;color:var(--ink);font:15px/1.6 "Segoe UI","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--gold2)}
.bar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px;background:#0b1f2e;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.bar button{border:0;border-radius:20px;padding:8px 15px;font:600 13px "Segoe UI",Arial,sans-serif;cursor:pointer;background:#24465e;color:#fff;transition:.2s}
.bar button:hover{background:var(--gold);color:#0b1f2e}
.seg{display:flex;background:#24465e;border-radius:20px;padding:3px}
.seg button{padding:5px 13px;background:transparent}
.seg button.on{background:var(--gold);color:#0b1f2e}
.sheet{max-width:1240px;margin:24px auto 40px;background:#fff;display:grid;grid-template-columns:300px minmax(0,1fr);box-shadow:0 12px 40px rgba(15,42,61,.2)}

/* ---------- Sidebar ---------- */
aside{background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%);color:#dce6ee;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sb{position:sticky;top:58px;max-height:calc(100vh - 58px);overflow:auto;padding:34px 26px 30px;scrollbar-width:thin;scrollbar-color:#2c5574 transparent}
.photo{width:150px;height:150px;border-radius:50%;margin:0 auto 18px;border:3px solid var(--gold);box-shadow:0 0 0 6px rgba(224,164,58,.15);overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.aname{text-align:center;color:#fff;font-weight:700;font-size:20px;letter-spacing:.3px}
.atitle{text-align:center;color:var(--gold);font-size:13px;margin:4px 0 6px;line-height:1.45}
aside h3{font-size:11.5px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.16)}
.ci{display:flex;gap:10px;font-size:13px;margin:9px 0;word-break:break-word;align-items:center}
.ci i{font-style:normal;color:var(--navy);background:var(--gold);width:21px;height:21px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ci a{color:inherit;text-decoration:none}.ci a:hover{color:#fff;text-decoration:underline}
nav a{display:block;color:#dce6ee;text-decoration:none;font-size:13.5px;padding:5px 10px;border-left:2px solid transparent;margin-left:-10px}
nav a:hover,nav a.cur{color:#fff;border-left-color:var(--gold);background:rgba(255,255,255,.05)}
.grp{margin-bottom:10px}.grp b{display:block;font-size:12.5px;color:#fff;margin:0 0 6px;font-weight:600}
.chip{display:inline-block;padding:2px 10px;margin:0 4px 6px 0;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.08);font-size:12px}
.lg{display:flex;justify-content:space-between;font-size:13px;margin:7px 0}.lg span:last-child{color:#a9bccb;font-size:12px}

/* ---------- Main ---------- */
main{padding:46px 52px 40px;min-width:0}
.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gold2);font-weight:700}
h1{font-size:44px;margin:6px 0 0;line-height:1.05;font-weight:300;color:var(--navy);letter-spacing:-.3px}
h1 b{font-weight:800}
.title{color:var(--gold2);font-size:18px;font-weight:700;margin:10px 0 12px}
.avail{display:inline-block;font-size:12.5px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:4px 12px;color:var(--muted)}
.avail:before{content:"● ";color:#2e9e6a}
.lead{font-size:16px;line-height:1.7;margin:18px 0 0;max-width:72ch}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:26px}
.kpi{background:var(--soft);border-left:3px solid var(--gold);padding:12px 14px;border-radius:0 8px 8px 0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.kpi b{display:block;font-size:24px;color:var(--navy);line-height:1.15;white-space:nowrap}
.kpi span{font-size:12.5px;color:var(--muted);line-height:1.4;display:block;margin-top:3px}
h2{font-size:15px;letter-spacing:2px;text-transform:uppercase;color:var(--navy);display:flex;align-items:center;gap:12px;margin:56px 0 20px;scroll-margin-top:70px}
h2:before{content:"";width:9px;height:9px;background:var(--gold);transform:rotate(45deg);flex:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
h2:after{content:"";flex:1;height:1.5px;background:linear-gradient(90deg,var(--gold),var(--line))}
.intro{color:var(--muted);margin:-8px 0 20px;max-width:75ch}

/* Experience */
.job{position:relative;padding:0 0 22px 22px;border-left:2px solid var(--line);margin-left:5px}
.job:before{content:"";position:absolute;left:-8px;top:4px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--gold)}
.jh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.role{font-weight:700;font-size:17px;color:var(--navy);line-height:1.3}
.date{font-size:12px;font-weight:600;color:var(--gold2);background:var(--goldbg);border:1px solid #f0d9ad;padding:2px 10px;border-radius:10px;white-space:nowrap;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.co{color:var(--gold2);font-weight:650;font-size:14px;margin-top:2px}.meta{color:var(--muted);font-size:12.5px;font-weight:400}
.job ul,.cs ul{margin:8px 0 0 18px;padding:0}.job li,.cs li{margin:4px 0;font-size:14.5px}
li::marker{color:var(--gold)}
li b,.cs p b{color:var(--navy)}

/* Case studies */
.cs{border:1px solid var(--line);border-radius:10px;padding:26px 28px;margin:0 0 22px;scroll-margin-top:70px}
.cs .k{font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold2);font-weight:700}
.cs h3{font-size:21px;color:var(--navy);margin:4px 0 8px;line-height:1.3}
.cs>p{margin:8px 0}
.stack{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.stack span{font-size:12px;padding:2px 9px;border-radius:10px;background:var(--soft);border:1px solid var(--line);color:var(--muted)}
.result{background:var(--goldbg);border-left:3px solid var(--gold);border-radius:0 8px 8px 0;padding:12px 16px;margin:14px 0 4px;font-size:14.5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.result b{color:var(--navy)}
.steps{margin:18px 0 6px}
.step{position:relative;padding:0 0 14px 22px;border-left:2px solid var(--line);margin-left:5px}
.step:before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:#fff;border:2.5px solid var(--gold)}
.step.cur:before{background:var(--gold)}
.step .sd{font-size:12px;font-weight:700;color:var(--gold2)}
.step h4{margin:1px 0 3px;font-size:15px;color:var(--navy)}
.step p{margin:0;font-size:14px;color:#2f3a4b}

/* Chart */
.chart{margin:20px 0 6px}
.chart h4{margin:0 0 2px;font-size:15px;color:var(--navy)}
.chart .sub{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.crow{display:grid;grid-template-columns:170px minmax(0,1fr);gap:4px 14px;align-items:center;margin:10px 0}
.crow .q{font-size:13px;color:var(--ink);line-height:1.3}
.bars{display:flex;flex-direction:column;gap:2px}
.br{display:flex;align-items:center;gap:8px;position:relative}
.br .m{height:14px;border-radius:0 4px 4px 0;min-width:3px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.br .v{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.br.a .v{color:var(--ink);font-weight:700}
.br .tip{display:none;position:absolute;left:0;bottom:18px;background:var(--navy);color:#fff;font-size:12px;padding:4px 8px;border-radius:5px;white-space:nowrap;z-index:2}
.br:hover .tip{display:block}
.br:hover .m{filter:brightness(.92)}
table{border-collapse:collapse;width:100%;font-size:13.5px;margin:10px 0}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--navy);font-size:12.5px;letter-spacing:.3px;background:var(--soft);-webkit-print-color-adjust:exact;print-color-adjust:exact}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}
details{margin:10px 0}
summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--gold2)}
summary:hover{color:var(--navy)}

/* Code */
.code{margin:12px 0}
.code .ch{display:flex;justify-content:space-between;gap:10px;background:#16364d;color:#dce6ee;font-size:12.5px;padding:7px 12px;border-radius:8px 8px 0 0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.code .ch b{color:#fff;font-weight:600}.code .ch span{color:var(--gold);text-transform:uppercase;letter-spacing:1px;font-size:11px;font-weight:700}
pre{margin:0;background:var(--code);color:#d7e3ec;padding:14px 16px;border-radius:0 0 8px 8px;overflow-x:auto;font:12.5px/1.55 Consolas,"SFMono-Regular",Menlo,monospace;-webkit-print-color-adjust:exact;print-color-adjust:exact}
pre .c{color:#7f97a9;font-style:italic}

/* Cards */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:10px;padding:16px 18px;border-top:3px solid var(--gold)}
.card .cd{font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--gold2);font-weight:700}
.card h4{margin:3px 0 6px;font-size:16px;color:var(--navy);line-height:1.3}
.card p{margin:0;font-size:14px}
.card ul{margin:6px 0 0 18px;padding:0}.card li{font-size:13.5px;margin:3px 0}

/* Timeline */
.yr{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.yr .y{font-weight:800;color:var(--navy);font-size:15px}
.yr h4{margin:0 0 3px;font-size:15px;color:var(--gold2)}
.yr p{margin:0;font-size:14px}

/* Toolbox, education */
.tb{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 18px;font-size:14px}
.tb b{color:var(--navy)}
.edu{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;border-left:3px solid var(--gold);background:var(--soft);border-radius:0 8px 8px 0;margin-bottom:9px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.deg{font-weight:700;font-size:15px;color:var(--navy);line-height:1.35}.sch{font-size:13px;color:var(--muted);margin-top:2px}
.edu .yr2{font-size:12.5px;color:var(--gold2);font-weight:700;white-space:nowrap}
.note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);margin-top:44px;padding-top:16px}
.note p{margin:6px 0}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.cta a{display:inline-block;text-decoration:none;font-weight:600;font-size:14px;padding:9px 16px;border-radius:20px;background:var(--navy);color:#fff}
.cta a.alt{background:var(--goldbg);color:var(--gold2);border:1px solid #f0d9ad}
.cta a:hover{background:var(--gold);color:var(--navy)}

body.short .fo{display:none!important}

@media (max-width:980px){
 .sheet{grid-template-columns:1fr;margin:0}
 .sb{position:static;max-height:none;padding:28px 20px}
 aside nav{display:none}
 main{padding:30px 16px 30px}
 .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
 .cards{grid-template-columns:1fr}
}
@media (max-width:560px){
 h1{font-size:34px}
 .cs{padding:18px 16px}
 .crow{grid-template-columns:1fr}
 .yr{grid-template-columns:1fr;gap:2px}
 .tb{grid-template-columns:1fr;gap:2px 0}.tb b{margin-top:8px}
 .kpi b{font-size:21px}
}
@media print{
 @page{size:A4;margin:12mm 0}
 body{background:#fff;font-size:13px}
 .bar,aside nav,.cta{display:none}
 .sheet{margin:0;box-shadow:none;grid-template-columns:240px minmax(0,1fr)}
 .sb{position:static;max-height:none;overflow:visible;padding:20px 18px}
 main{padding:10px 30px}
 .cs,.card,.job,.edu,.yr,.code,.chart{break-inside:avoid}
 details{display:block}details>*{display:block}
 h2{break-after:avoid}
}
</style>
</head>

<script type="application/json" id="codejson">{"code": {"g:q_before": "-- Before: aggregate every server's requests, then join.\n-- Pays for the whole table, even for a 50-row page.\nSELECT s.id, s.name, r.status AS dns_status\nFROM servers s\nLEFT JOIN (\n    SELECT server_id, max(id) AS last_id\n    FROM dns_requests\n    WHERE deleted_at IS NULL\n    GROUP BY server_id\n) last ON last.server_id = s.id\nLEFT JOIN dns_requests r ON r.id = last.last_id\nWHERE s.kind = 'small' AND s.deleted_at IS NULL;\n", "g:q_after": "-- After: one index lookup per row that passes the filters,\n-- on dns_requests (server_id, id) WHERE deleted_at IS NULL.\nSELECT s.id, s.name, r.status AS dns_status\nFROM servers s\nLEFT JOIN LATERAL (\n    SELECT status\n    FROM dns_requests\n    WHERE server_id = s.id AND deleted_at IS NULL\n    ORDER BY id DESC\n    LIMIT 1\n) r ON true\nWHERE s.kind = 'small' AND s.deleted_at IS NULL;\n", "g:q_union": "-- The branches never overlap, so UNION ALL: no sort to remove duplicates.\n-- Each branch states its own kind, so a filter on the view lets PostgreSQL\n-- drop the branches it excludes before reading anything.\nCREATE VIEW server_grid AS\nSELECT s.id, s.kind, s.name, n.cidr\nFROM servers s\nJOIN subnets n ON n.server_id = s.id AND n.deleted_at IS NULL\nWHERE s.kind = 'large' AND s.deleted_at IS NULL\nUNION ALL\nSELECT s.id, s.kind, s.name, NULL::cidr\nFROM servers s\nWHERE s.kind = 'small' AND s.deleted_at IS NULL;\n\nEXPLAIN (COSTS OFF) SELECT * FROM server_grid WHERE kind = 'small';\n--  Seq Scan on servers s\n--    Filter: ((deleted_at IS NULL) AND (kind = 'small'::text))\n-- The 'large' branch and its join to subnets are not in the plan at all.\n", "g:q_grid": "// Before: the subnet list was a correlated subquery, so a search on it\n// ran the subquery once for every row of the grid.\n$before = DB::table('servers as s')\n    ->select('s.id', 's.name', 's.kind')\n    ->whereNull('s.deleted_at')\n    ->whereRaw(\n        \"(SELECT string_agg(cidr::text, ', ') FROM subnets\n          WHERE server_id = s.id AND active AND deleted_at IS NULL) ILIKE ?\",\n        [\"%{$term}%\"]\n    );\n\n// After: aggregate the active subnets once, join the result, filter the join.\n$subnets = DB::table('subnets')\n    ->select('server_id')\n    ->selectRaw(\"string_agg(cidr::text, ', ' ORDER BY cidr) AS subnets\")\n    ->where('active', true)\n    ->whereNull('deleted_at')\n    ->groupBy('server_id');\n\n$grid = DB::table('servers as s')\n    ->leftJoinSub($subnets, 'sn', 'sn.server_id', '=', 's.id')\n    ->select('s.id', 's.name', 's.kind', 'sn.subnets')\n    ->whereNull('s.deleted_at')\n    ->when($term, fn ($q) => $q->where('sn.subnets', 'ilike', \"%{$term}%\"))\n    ->orderBy('s.name')\n    ->orderBy('s.id');   // unique tie-breaker: OFFSET paging never repeats or skips a row\n", "g:bulk_update": "use Illuminate\\Support\\Facades\\DB;\n\n/**\n * Update many rows with one statement per chunk, every value bound.\n * Rows that already hold the new values are skipped (IS DISTINCT FROM).\n * $types maps each column, key included, to its SQL type: VALUES\n * parameters arrive untyped, so each one is cast.\n */\nfunction updateMany(string $table, array $rows, array $types, string $key = 'id'): int\n{\n    $cols = array_keys($types);\n    $others = array_diff($cols, [$key]);\n\n    $tuple   = '(' . implode(', ', array_map(fn ($c) => \"?::{$types[$c]}\", $cols)) . ')';\n    $set     = implode(', ', array_map(fn ($c) => \"$c = v.$c\", $others));\n    $differs = implode(' OR ', array_map(fn ($c) => \"t.$c IS DISTINCT FROM v.$c\", $others));\n    $colList = implode(', ', $cols);\n\n    $updated = 0;\n    // PostgreSQL accepts at most 65,535 bind parameters per statement.\n    foreach (array_chunk($rows, intdiv(65535, count($cols))) as $chunk) {\n        $values   = implode(', ', array_fill(0, count($chunk), $tuple));\n        $bindings = array_merge(...array_map(\n            fn ($row) => array_map(fn ($c) => $row[$c], $cols),\n            $chunk\n        ));\n\n        $updated += DB::update(\n            \"UPDATE $table AS t SET $set\n             FROM (VALUES $values) AS v($colList)\n             WHERE t.$key = v.$key AND ($differs)\",\n            $bindings\n        );\n    }\n\n    return $updated;\n}\n\n// 40,000 rows, 2 columns: two statements, not 40,000 find-and-save round trips.\nDB::transaction(fn () => updateMany('assignments', $moves, ['id' => 'bigint', 'list_id' => 'integer']));\n", "g:horizon": "// Horizon's parent provider ships with:\n//     Horizon::auth(fn ($request) => Gate::check('viewHorizon', [$request->user()])\n//         || app()->environment('local'));\n// Overriding only gate() keeps that \"local\" bypass, so override authorization().\nclass HorizonServiceProvider extends HorizonApplicationServiceProvider\n{\n    protected function authorization()\n    {\n        $this->gate();\n\n        Horizon::auth(fn ($request) => config('devtools.enabled')\n            && Gate::check('viewHorizon', [$request->user()]));\n    }\n\n    protected function gate()\n    {\n        Gate::define('viewHorizon', fn ($user) => $user->can('use-devtools'));\n    }\n}\n", "g:debug_mw": "// Debug dashboards answer 404 to anyone not allowed, so they cannot be found.\nclass RequireDevtoolsAccess\n{\n    public function handle(Request $request, Closure $next): Response\n    {\n        $allowed = config('devtools.enabled')                     // environment switch\n            && $request->user()?->can('use-devtools')             // role and permission\n            && $request->session()->get('devtools_on', false);    // opted in this session\n\n        abort_unless($allowed, 404);\n\n        return $next($request);\n    }\n}\n", "g:queue": "'redis' => [\n    'driver' => 'redis',\n    'connection' => 'default',\n    'queue' => 'interactive',\n    // Must be longer than the longest worker --timeout (3600 s). At 1800,\n    // a job still running was handed to a second worker and ran twice.\n    'retry_after' => 3900,\n    'block_for' => null,\n],\n", "g:transaction": "// Bug class: a path that opens a transaction and never commits it. Every later\n// write on that connection joins it, and all of them are rolled back when the\n// worker's connection closes. No error is raised.\nDB::beginTransaction();\n$this->markProcessed($batch);\nif ($batch->isEmpty()) {\n    return;                    // the transaction stays open\n}\nDB::commit();\n\n// The pattern that prevents it: the closure commits on return\n// and rolls back on an exception.\nDB::transaction(function () use ($batch) {\n    $this->markProcessed($batch);\n});\n", "g:guard": "#!/usr/bin/env bash\n# PreToolUse hook for shell commands (Claude Code and Cursor).\n# Exit code 2 blocks the call; stderr tells the agent why.\ncmd=$(jq -r '.tool_input.command // empty')\nblock() { echo \"Blocked: $1\" >&2; exit 2; }\n\nsql_client=0\n# One line per segment of the command; read trims the spaces.\nwhile read -r seg; do\n  case \"$seg\" in\n    \"php artisan migrate\"*|\"php artisan db:seed\"*|\"php artisan db:wipe\"*)\n      block \"schema and data changes are run by a person, after review\" ;;\n    \"git reset --hard\"*|\"git clean -\"*f*|\"git push\"*--force*|\"git push\"*\" -f\"*)\n      block \"destructive git\" ;;\n    psql*|mysql*|\"php artisan tinker\"*|\"php artisan db\"*)\n      sql_client=1 ;;\n  esac\ndone < <(sed -E 's/(&&|\\|\\||;|\\|)/\\n/g' <<<\"$cmd\")\n\n# Write keywords only count when a segment runs a SQL client,\n# so `git commit -m \"drop the old view\"` still passes.\nif (( sql_client )) && grep -qiwE 'alter|update|insert|delete|drop|truncate' <<<\"$cmd\"; then\n  block \"SQL that writes; show the statement for review instead\"\nfi\nexit 0\n", "g:sealed": "// sealedSecret keeps a password AES-GCM encrypted in memory locked against\n// swapping, and opens it only for the moment a login needs it.\ntype sealedSecret struct {\n\taead    cipher.AEAD\n\tnonce   []byte\n\tbox     []byte // ciphertext\n\tscratch []byte // locked buffer the plaintext is opened into\n}\n\nfunc seal(key, password []byte) (*sealedSecret, error) {\n\tblock, err := aes.NewCipher(key)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\taead, err := cipher.NewGCM(block)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\tnonce := make([]byte, aead.NonceSize())\n\tif _, err := rand.Read(nonce); err != nil {\n\t\treturn nil, err\n\t}\n\ts := &sealedSecret{\n\t\taead:    aead,\n\t\tnonce:   nonce,\n\t\tbox:     aead.Seal(nil, nonce, password, nil),\n\t\tscratch: make([]byte, 0, len(password)),\n\t}\n\tfor _, b := range [][]byte{s.box, s.scratch[:cap(s.scratch)]} {\n\t\tif err := syscall.Mlock(b); err != nil {\n\t\t\treturn nil, err\n\t\t}\n\t}\n\treturn s, nil\n}\n\n// use opens the password into the locked buffer, hands it to fn, then wipes it.\nfunc (s *sealedSecret) use(fn func(password []byte) error) error {\n\tplain, err := s.aead.Open(s.scratch[:0], s.nonce, s.box, nil)\n\tif err != nil {\n\t\treturn err\n\t}\n\tdefer clear(plain)\n\treturn fn(plain)\n}\n", "g:reporter": "// Posts results every 100–130 s; the jitter keeps a fleet of desktops from\n// posting in the same second. A failed post goes back in the queue.\npublic class ResultReporter\n{\n    private readonly ConcurrentQueue<Result> _pending = new ConcurrentQueue<Result>();\n    private readonly Random _random = new Random();\n    private readonly HttpClient _http;\n    private readonly string _reportUrl;\n\n    public ResultReporter(HttpClient http, string reportUrl)\n    {\n        _http = http;\n        _reportUrl = reportUrl;\n    }\n\n    public void Add(Result result) => _pending.Enqueue(result);\n\n    public async Task RunAsync(CancellationToken stop)\n    {\n        while (!stop.IsCancellationRequested)\n        {\n            await Task.Delay(TimeSpan.FromSeconds(100 + _random.Next(0, 31)), stop);\n\n            var batch = new List<Result>();\n            while (_pending.TryDequeue(out var result)) batch.Add(result);\n            if (batch.Count == 0) continue;\n\n            try\n            {\n                var body = new StringContent(JsonConvert.SerializeObject(batch), Encoding.UTF8, \"application/json\");\n                var response = await _http.PostAsync(_reportUrl, body, stop);\n                response.EnsureSuccessStatusCode();\n            }\n            catch (Exception) when (!stop.IsCancellationRequested)\n            {\n                batch.ForEach(_pending.Enqueue);   // try again next round\n            }\n        }\n    }\n}\n", "g:smtp": "// An SMTP session from a chosen source IP; every reply code is checked.\npublic class SmtpSession implements Closeable {\n    private final Socket socket = new Socket();\n    private final BufferedReader in;\n    private final Writer out;\n\n    public SmtpSession(InetAddress sourceIp, String mxHost) throws IOException {\n        try {\n            socket.bind(new InetSocketAddress(sourceIp, 0));   // like a PowerMTA virtual MTA\n            socket.connect(new InetSocketAddress(mxHost, 25), 30_000);\n            socket.setSoTimeout(60_000);\n            in = new BufferedReader(new InputStreamReader(socket.getInputStream(), StandardCharsets.US_ASCII));\n            out = new OutputStreamWriter(socket.getOutputStream(), StandardCharsets.US_ASCII);\n            expect(\"220\");\n        } catch (IOException e) {\n            socket.close();\n            throw e;\n        }\n    }\n\n    public String command(String line, String... okCodes) throws IOException {\n        out.write(line + \"\\r\\n\");\n        out.flush();\n        return expect(okCodes);\n    }\n\n    // Multi-line replies (\"250-SIZE\", \"250-PIPELINING\", \"250 OK\") end at the line without a dash.\n    private String expect(String... okCodes) throws IOException {\n        String line;\n        do {\n            line = in.readLine();\n            if (line == null) {\n                throw new IOException(\"connection closed\");\n            }\n        } while (line.length() > 3 && line.charAt(3) == '-');\n        for (String code : okCodes) {\n            if (line.startsWith(code)) {\n                return line;\n            }\n        }\n        throw new IOException(\"unexpected reply: \" + line);\n    }\n\n    @Override\n    public void close() throws IOException {\n        socket.close();\n    }\n}\n", "g:cipher": "// A toy version of the idea, with made-up tables: every digit has several\n// symbols and one is picked at random, so the same id rarely encodes the same way.\nconst HOMOPHONES = [\n    '0' => 'kQ7', '1' => 'aX2', '2' => 'mR9', '3' => 'zT4', '4' => 'eW1',\n    '5' => 'pL8', '6' => 'cV3', '7' => 'hN0', '8' => 'sJ5', '9' => 'uB6',\n];\n\nfunction encode(string $digits): string\n{\n    $out = '';\n    foreach (str_split($digits) as $d) {\n        $symbols = HOMOPHONES[$d];\n        $out .= $symbols[random_int(0, strlen($symbols) - 1)];\n    }\n    return $out;\n}\n\nfunction decode(string $code): string\n{\n    $digits = '';\n    foreach (str_split($code) as $c) {\n        foreach (HOMOPHONES as $digit => $symbols) {\n            if (str_contains($symbols, $c)) {\n                $digits .= $digit;\n                break;\n            }\n        }\n    }\n    return $digits;\n}\n\n// encode('31415926') three times: \"4aWXL69V\", \"42WXpum3\", \"T2W286mV\"\n// decode() of any of them gives back 31415926.\n", "g:canonical_php": "/** Gmail ignores dots and anything after \"+\": J.Doe+news@Gmail.com is jdoe@gmail.com. */\nfunction canonicalEmail(string $email): string\n{\n    $email = strtolower(trim($email));\n    $at = strrpos($email, '@');\n    if ($at === false) {\n        return $email;\n    }\n    $local = substr($email, 0, $at);\n    $domain = substr($email, $at + 1);\n    if ($domain === 'gmail.com' || $domain === 'googlemail.com') {\n        $local = str_replace('.', '', explode('+', $local, 2)[0]);\n        $domain = 'gmail.com';\n    }\n    return \"$local@$domain\";\n}\n", "g:pg_functions": "-- Same canonical form as the PHP helper. IMMUTABLE, so it can back an\n-- expression index: CREATE INDEX ON lists.x (canonical_email(email)).\nCREATE FUNCTION canonical_email(address text) RETURNS text\nLANGUAGE sql IMMUTABLE STRICT AS $$\n    SELECT CASE\n               WHEN domain IN ('gmail.com', 'googlemail.com')\n                   THEN replace(split_part(local, '+', 1), '.', '') || '@gmail.com'\n               WHEN domain = '' THEN local\n               ELSE local || '@' || domain\n           END\n    FROM (SELECT split_part(a, '@', 1) AS local, split_part(a, '@', 2) AS domain\n          FROM (SELECT lower(btrim(address)) AS a) AS input) AS parts\n$$;\n\n-- Soft-delete addresses from many list tables in one call. Each table runs in\n-- its own exception block (a subtransaction): a table that fails is reported\n-- and skipped, and the tables already done keep their changes.\nCREATE FUNCTION soft_delete_addresses(tables text[], addresses text[])\nRETURNS TABLE (list_table text, deleted integer)\nLANGUAGE plpgsql AS $$\nDECLARE\n    wanted text[] := ARRAY(SELECT DISTINCT canonical_email(a) FROM unnest(addresses) AS a);\n    total integer := coalesce(array_length(tables, 1), 0);\n    done integer := 0;\n    t text;\n    n integer;\nBEGIN\n    FOREACH t IN ARRAY coalesce(tables, '{}') LOOP\n        BEGIN\n            EXECUTE format(\n                'UPDATE lists.%I SET deleted_at = now()\n                 WHERE deleted_at IS NULL AND canonical_email(email) = ANY($1)', t)\n            USING wanted;\n            GET DIAGNOSTICS n = ROW_COUNT;\n        EXCEPTION WHEN OTHERS THEN\n            RAISE NOTICE 'skipped lists.%: %', t, SQLERRM;\n            n := 0;\n        END;\n\n        done := done + 1;\n        IF n > 0 THEN\n            list_table := t;\n            deleted := n;\n            RETURN NEXT;\n        END IF;\n        IF done % greatest(total / 5, 1) = 0 THEN\n            RAISE NOTICE '% of % tables done', done, total;\n        END IF;\n    END LOOP;\nEND\n$$;\n\n-- SELECT * FROM soft_delete_addresses(ARRAY['l1', 'missing', 'l2'],\n--                                     ARRAY['j.doe@gmail.com', 'B@yahoo.com']);\n-- NOTICE:  skipped lists.missing: relation \"lists.missing\" does not exist\n--  list_table | deleted\n--  l1         |       2\n--  l2         |       2\n"}, "meta": {"g:q_before": {"title": "Before: aggregate every request, then join", "lang": "sql", "src": "written for this report · run on PostgreSQL 16 test data"}, "g:q_after": {"title": "After: LATERAL, one index lookup per row", "lang": "sql", "src": "written for this report · run on PostgreSQL 16 test data"}, "g:q_union": {"title": "A UNION ALL view whose branches the planner can skip", "lang": "sql", "src": "written for this report · run on PostgreSQL 16 test data"}, "g:q_grid": {"title": "Aggregate once, join, page in a stable order (Laravel)", "lang": "php", "src": "written for this report · run or linted on PHP 8.3"}, "g:bulk_update": {"title": "Many rows, one statement per chunk (Laravel)", "lang": "php", "src": "written for this report · run or linted on PHP 8.3"}, "g:canonical_php": {"title": "Canonical Gmail address (PHP)", "lang": "php", "src": "written for this report · run or linted on PHP 8.3"}, "g:pg_functions": {"title": "Canonical form and a cross-table soft delete (PL/pgSQL)", "lang": "sql", "src": "written for this report · run on PostgreSQL 16 test data"}, "g:horizon": {"title": "Closing Horizon's local-environment bypass", "lang": "php", "src": "written for this report · run or linted on PHP 8.3"}, "g:debug_mw": {"title": "Debug dashboards that answer 404", "lang": "php", "src": "written for this report · run or linted on PHP 8.3"}, "g:queue": {"title": "retry_after above the worker timeout", "lang": "php", "src": "written for this report · run or linted on PHP 8.3"}, "g:transaction": {"title": "An uncommitted transaction, and the pattern that prevents it", "lang": "php", "src": "written for this report · run or linted on PHP 8.3"}, "g:guard": {"title": "Shell guard hook (PreToolUse)", "lang": "bash", "src": "written for this report · run against test cases"}, "g:sealed": {"title": "A password sealed in locked memory (Go)", "lang": "go", "src": "written for this report · go vet and run"}, "g:reporter": {"title": "Jittered posting loop (C# 7.3)", "lang": "csharp", "src": "written for this report · compiled as C# 7.3"}, "g:smtp": {"title": "An SMTP session from a chosen source IP (Java 7)", "lang": "java", "src": "written for this report · compiled for Java 7, run against a fake SMTP server"}, "g:cipher": {"title": "A toy homophonic substitution cipher", "lang": "php", "src": "written for this report · run or linted on PHP 8.3"}}}</script>

 /* ---------- Case studies ---------- */
 csIntro:X("Five pieces of work from 2025–2026, each with the problem, the steps and a measured result. Code samples use generic names and simplified logic; none of them is employer code.",
  "Cinq réalisations de 2025–2026, chacune avec le problème, les étapes et un résultat mesuré. Les exemples de code utilisent des noms génériques et une logique simplifiée ; aucun n'est du code de l'employeur."),
 cases:[
 {id:"grid",k:X("Query design","Conception de requêtes"),
  h:X("An operations grid rebuilt five times, from a 13-join query to 0.6 s","Une grille opérationnelle reconstruite cinq fois, d'une requête à 13 jointures à 0,6 s"),
  p:X("The grid where operators decide which rented servers and subnets go back to their providers. Each row combines the server, its subnets and IP status, the provider, ASN organisations, the latest reverse-DNS request and the return request, across four database schemas. I wrote the first version in 2022 and rebuilt it four times; each rebuild removed one specific cost.",
   "La grille où les opérateurs décident quels serveurs et sous-réseaux loués sont rendus aux fournisseurs. Chaque ligne combine le serveur, ses sous-réseaux et le statut des IP, le fournisseur, les organisations ASN, la dernière demande de reverse DNS et la demande de restitution, sur quatre schémas de base de données. J'en ai écrit la première version en 2022 et l'ai reconstruite quatre fois ; chaque refonte a supprimé un coût précis."),
  stack:["PostgreSQL","Views","Materialized views","UNION ALL","LATERAL","Laravel query builder","DataTables"],
  result:X("Against the version it replaced: <b>16× faster to open</b> (10.3 s → 0.63 s), <b>50× faster to search</b> (27.1 s → 0.54 s) and a status filter that used to hang now answers in <b>0.57 s</b>. The view kept the same 38 columns, so no screen changed.",
   "Par rapport à la version précédente : <b>ouverture 16× plus rapide</b> (10,3 s → 0,63 s), <b>recherche 50× plus rapide</b> (27,1 s → 0,54 s) et un filtre de statut qui ne répondait plus s'exécute en <b>0,57 s</b>. La vue garde les mêmes 38 colonnes : aucun écran n'a changé."),
  steps:[["Feb 2022 – Jun 2025",X("One query built in the controller","Une requête construite dans le contrôleur"),X("Every load ran a 13-join ORM query, unpacked a JSON array per row and found the latest reverse-DNS request with a correlated max() subquery.","Chaque chargement exécutait une requête ORM à 13 jointures, dépliait un tableau JSON par ligne et cherchait la dernière demande de reverse DNS par sous-requête max() corrélée.")],
   ["Jun 2025",X("A materialized view","Une vue matérialisée"),X("The query moved into PostgreSQL as a materialized view with three branches. Reads became fast, but every save needed a full refresh.","La requête passe dans PostgreSQL sous forme de vue matérialisée à trois branches. Lectures rapides, mais chaque enregistrement exigeait un rafraîchissement complet.")],
   ["Jul – Aug 2025",X("Live view, one branch materialized","Vue live, une seule branche matérialisée"),X("Only the rarely changing branch stayed materialized, so edits show up at once.","Seule la branche qui change rarement reste matérialisée : les modifications apparaissent immédiatement.")],
   ["Oct 2025",X("A single live view","Une vue live unique"),X("Subnets joined per server, group membership from a view instead of JSON, a category condition on each branch. Some filters could still trap the planner in a nested loop.","Sous-réseaux joints par serveur, appartenance aux groupes lue dans une vue plutôt qu'en JSON, condition de catégorie sur chaque branche. Certains filtres piégeaient encore le planificateur dans une boucle imbriquée.")],
   ["Oct 2026",X("UNION ALL, LATERAL and a rebuilt grid query","UNION ALL, LATERAL et requête de grille refaite"),X("UNION ALL instead of UNION (no duplicate-removal sort), LATERAL lookups only for rows that pass the filters, the category condition repeated on every join so PostgreSQL skips excluded branches, and a stable paging order.","UNION ALL au lieu de UNION (plus de tri de dédoublonnage), recherches LATERAL uniquement pour les lignes filtrées, condition de catégorie répétée sur chaque jointure pour que PostgreSQL ignore les branches exclues, et ordre de pagination stable.")]],
  chart:true, code:["g:q_before","g:q_after"], more:["g:q_union","g:q_grid"]},
 {id:"data",k:X("Data model & integrity","Modèle de données & intégrité"),
  h:X("One view of a record's life, and bulk changes that cannot half-apply","Une vue unique du cycle de vie, et des corrections en masse qui ne s'appliquent jamais à moitié"),
  p:X("Test mailboxes are the accounts outgoing mail is checked against: tens of millions of rows, grouped in lists, assigned to requests and shared between business units. This work gave every screen the same picture of a record's lifecycle and made bulk corrections safe.",
   "Les boîtes de test sont les comptes sur lesquels les envois sont vérifiés : des dizaines de millions de lignes, regroupées en listes, affectées à des demandes et partagées entre entités. Ce travail donne à chaque écran la même vision du cycle de vie d'un enregistrement et sécurise les corrections en masse."),
  stack:["PostgreSQL","PL/pgSQL","Materialized views","Laravel transactions","Artisan"],
  result:X("<b>Nine modules</b> read one 30-line lifecycle view instead of repeating a five-table join; corrections move uploaded sets in <b>one transaction</b> that rolls back on any mismatch; a multi-row update helper replaced find-and-save per row (70,000 rows → 4 statements in tests).",
   "<b>Neuf modules</b> lisent une seule vue de cycle de vie de 30 lignes au lieu de répéter une jointure sur cinq tables ; les corrections déplacent les lots importés en <b>une seule transaction</b> annulée à la moindre incohérence ; une mise à jour multi-lignes remplace le find-and-save ligne par ligne (70 000 lignes → 4 requêtes en test)."),
  bullets:X(["<b>Lifecycle view (May 2025):</b> each record followed from address to list, assignment, request and apportionment; internal lists excluded in one place.","<b>Materialized copy (Jul 2025):</b> the heaviest lists grid reads a copy refreshed right after the actions that change its counts.","<b>Corrections in one transaction (Oct 2025 – 2026):</b> CSV/TXT uploads up to 5 MB, business unit and provider checked first, statements chunked under PostgreSQL's 65,535 bind-parameter limit.","<b>Cleanup inside the database:</b> five PL/pgSQL functions, including an IMMUTABLE canonical-address function and cross-table soft deletes that report and skip a failing table instead of aborting.","<b>Bounce processing (2022 – 2026):</b> hard, soft and temporary bounces removed across a group's tables, Gmail dots and +tags normalized, temporary bounces restored the next day."],
   ["<b>Vue de cycle de vie (mai 2025) :</b> chaque enregistrement suivi de l'adresse à la liste, l'affectation, la demande et la répartition ; listes internes exclues en un seul endroit.","<b>Copie matérialisée (juil. 2025) :</b> la grille la plus lourde lit une copie rafraîchie juste après les actions qui modifient ses compteurs.","<b>Corrections en une transaction (oct. 2025 – 2026) :</b> imports CSV/TXT jusqu'à 5 Mo, entité et fournisseur vérifiés d'abord, requêtes découpées sous la limite de 65 535 paramètres de PostgreSQL.","<b>Nettoyage dans la base :</b> cinq fonctions PL/pgSQL, dont une fonction IMMUTABLE d'adresse canonique et des suppressions logiques multi-tables qui signalent et ignorent une table en échec au lieu de tout interrompre.","<b>Traitement des rebonds (2022 – 2026) :</b> rebonds durs, temporaires et soft retirés de toutes les tables d'un groupe, points et +tags Gmail normalisés, rebonds temporaires restaurés le lendemain."]),
  code:["g:bulk_update"], more:["g:pg_functions","g:canonical_php"]},
 {id:"upgrade",k:X("Platform","Plateforme"),
  h:X("Laravel 9 → 12 → 13 in under three weeks, with Horizon, Reverb and secured debug tools","Laravel 9 → 12 → 13 en moins de trois semaines, avec Horizon, Reverb et des outils de debug sécurisés"),
  p:X("The platform ran Laravel 9 on PHP 8.0. It moved to Laravel 12 / PHP 8.2 in August 2026 and to Laravel 13 / PHP 8.3 less than three weeks later, while feature work continued.",
   "La plateforme tournait sous Laravel 9 / PHP 8.0. Elle est passée à Laravel 12 / PHP 8.2 en août 2026, puis à Laravel 13 / PHP 8.3 moins de trois semaines plus tard, sans interrompre les développements."),
  stack:["Laravel 9 → 13","PHP 8.0 → 8.3","Composer","Horizon","Reverb","Telescope","Livewire 4","Vue 3","Vite","Tailwind 4","Docker","GitLab CI"],
  result:X("Two major versions in <b>under three weeks</b>; abandoned packages replaced; Laravel Reverb replaced a Node socket.io server for live notifications, removing <b>950 files and 149,065 lines</b> of vendored code.",
   "Deux versions majeures en <b>moins de trois semaines</b> ; paquets abandonnés remplacés ; Laravel Reverb remplace un serveur Node socket.io pour les notifications temps réel, supprimant <b>950 fichiers et 149 065 lignes</b> de code embarqué."),
  steps:[["Aug 2026",X("Laravel 12, PHP 8.2","Laravel 12, PHP 8.2"),X("Replaced abandoned packages with maintained forks or framework built-ins; fixed breaking changes in query-builder expressions, Monolog 3, Carbon strict typing and CORS middleware across 36 files; updated CI and Docker the same day.","Paquets abandonnés remplacés par des forks maintenus ou des fonctions natives ; corrections des ruptures (expressions du query builder, Monolog 3, typage strict de Carbon, middleware CORS) sur 36 fichiers ; CI et Docker mis à jour le jour même.")],
   ["Aug 2026",X("Debug tools behind four gates","Outils de debug derrière quatre verrous"),X("Telescope, Pulse, Debugbar and Horizon open only with an environment switch, team membership, a permission and a per-session opt-in; dashboards answer 404, not 403; Horizon's local-environment bypass closed.","Telescope, Pulse, Debugbar et Horizon ne s'ouvrent qu'avec un interrupteur d'environnement, l'appartenance à l'équipe, une permission et un choix par session ; réponse 404 et non 403 ; contournement « local » de Horizon fermé.")],
   ["Sep 2026",X("Laravel 13, PHP 8.3","Laravel 13, PHP 8.3"),X("A framework patch changed how route() encodes URLs and broke tokens in generated links: pinned the same day, fixed with custom URL generators, then reopened to minor updates.","Un correctif du framework changeait l'encodage des URL de route() et cassait les jetons des liens générés : version figée le jour même, corrigée par des générateurs d'URL personnalisés, puis réouverte aux mises à jour mineures.")],
   ["Sep 2026",X("A modern front-end beside the existing one","Un front-end moderne à côté de l'existant"),X("Livewire 4, Vue 3 via Vite and Tailwind 4 next to Blade and jQuery pages, with a written rule of one reactive framework per page region; Horizon tags on every queued job.","Livewire 4, Vue 3 via Vite et Tailwind 4 à côté des pages Blade et jQuery, avec une règle écrite d'un seul framework réactif par zone de page ; tags Horizon sur chaque job.")]],
  code:["g:horizon"], more:["g:debug_mw"]},
 {id:"queues",k:X("Reliability","Fiabilité"),
  h:X("Queues and live notifications, rebuilt from a measured audit","Files d'attente et notifications temps réel, reconstruites à partir d'un audit chiffré"),
  p:X("In September 2026 I audited every job, worker, dispatcher and failure, from the code, the Supervisor and cron files of each host and read-only queries on Redis. The findings became a written roadmap, fixed one merge request at a time.",
   "En septembre 2026, j'ai audité chaque job, worker, dispatcher et échec, à partir du code, des fichiers Supervisor et cron de chaque hôte et de requêtes en lecture seule sur Redis. Les constats sont devenus une feuille de route écrite, corrigée une merge request à la fois."),
  stack:["Laravel queues","Redis","Supervisor","cron","Horizon","Reverb","Laravel Echo"],
  table:{head:X(["Area","Found in the audit","Now"],["Domaine","Constat de l'audit","Aujourd'hui"]),
   rows:X([["Worker pool","202 processes in one catch-all queue","87 processes across four purpose queues, sized from a measured peak of 45 concurrent jobs over 60 days"],["Duplicate runs","retry_after (1,800 s) below the 3,600 s timeout: long jobs started twice","retry_after 3,900 s; interactive jobs run once"],["Worker type","queue:listen booted the framework for every job","queue:work"],["Stuck work","Jobs in a queue with no worker; dead job classes","Drained; dead jobs and idle workers removed"],["Notifications","Silently lost to an uncommitted transaction","Saved, with live updates over Reverb on private user channels"],["View refreshes","Dispatched from 99 call sites, no deduplication","At most one pending refresh per view set"],["Request tracking","56,000 inserts per hour, mostly polling","≈37,800 per hour skipped via an editable skip-list"]],
    [["Pool de workers","202 processus dans une file fourre-tout","87 processus répartis sur quatre files dédiées, dimensionnées sur un pic mesuré de 45 jobs simultanés sur 60 jours"],["Exécutions en double","retry_after (1 800 s) inférieur au timeout de 3 600 s : jobs longs lancés deux fois","retry_after à 3 900 s ; jobs interactifs exécutés une seule fois"],["Type de worker","queue:listen redémarrait le framework à chaque job","queue:work"],["Travail bloqué","Jobs dans une file sans worker ; classes de jobs mortes","Files vidées ; jobs morts et workers inactifs supprimés"],["Notifications","Perdues silencieusement à cause d'une transaction non validée","Enregistrées, avec mise à jour temps réel via Reverb sur canaux privés"],["Rafraîchissement des vues","Déclenché depuis 99 endroits, sans dédoublonnage","Au plus un rafraîchissement en attente par groupe de vues"],["Suivi des requêtes","56 000 insertions par heure, surtout du polling","≈37 800 par heure ignorées via une liste d'exclusion éditable"]])},
  result:X("<b>202 → 87</b> worker processes, no more duplicate runs of long jobs, notifications delivered live, and <b>37,800 fewer writes per hour</b>.","<b>202 → 87</b> processus workers, plus d'exécutions en double des jobs longs, notifications livrées en temps réel et <b>37 800 écritures de moins par heure</b>."),
  code:["g:queue"], more:["g:transaction"]},
 {id:"ai",k:X("Engineering practice","Pratiques d'ingénierie"),
  h:X("AI-assisted engineering: one contract, enforced rules","Développement assisté par IA : un contrat, des règles appliquées"),
  p:X("Since July 2026 the team's AI assistants (Claude Code, Cursor, GitHub Copilot and Antigravity) follow one written contract and the same safety rules. The rules are enforced by hooks, and a git hook applies the same checks to every commit, whatever tool wrote it.",
   "Depuis juillet 2026, les assistants IA de l'équipe (Claude Code, Cursor, GitHub Copilot et Antigravity) suivent un contrat écrit unique et les mêmes règles de sécurité. Ces règles sont appliquées par des hooks, et un hook git applique les mêmes contrôles à chaque commit, quel que soit l'outil qui l'a écrit."),
  stack:["Claude Code","Cursor","GitHub Copilot","Antigravity","Bash","jq","git hooks","glab"],
  bullets:X(["<b>AGENTS.md:</b> stack, non-standard paths, workflow (trace route → controller → request → model → view first, smallest patch, reuse before writing), comment policy and safety rules, read by all four tools.","<b>Six skills (472 lines):</b> module scaffolding, grid columns and filters, a schema map with SQL style and dry runs in rolled-back transactions, modal forms, front-end layering, and the GitLab issue-to-MR lifecycle.","<b>Hooks:</b> a shell guard blocks SQL that writes, migrations, destructive git and pushes to protected branches, judging each command segment by what it runs (checked against 14 cases); a path guard protects vendored files; a syntax check runs after every edit.","<b>Workflow:</b> every change is an issue, a branch and a reviewed merge request; the same setup was rolled out to two more repositories."],
   ["<b>AGENTS.md :</b> stack, chemins non standard, méthode (tracer route → contrôleur → requête → modèle → vue d'abord, plus petit correctif, réutiliser avant d'écrire), politique de commentaires et règles de sécurité, lus par les quatre outils.","<b>Six skills (472 lignes) :</b> création de modules, colonnes et filtres de grilles, carte du schéma avec style SQL et essais en transactions annulées, formulaires modaux, couches front-end et cycle GitLab ticket → MR.","<b>Hooks :</b> un garde shell bloque le SQL en écriture, les migrations, le git destructif et les push sur branches protégées, en jugeant chaque segment de commande (validé sur 14 cas) ; un garde de chemins protège les fichiers embarqués ; une vérification de syntaxe suit chaque modification.","<b>Workflow :</b> chaque changement est un ticket, une branche et une merge request revue ; le dispositif a été étendu à deux autres dépôts."]),
  result:X("Since the workflow started, <b>84 of 97</b> merged merge requests contain my commits.","Depuis le lancement du workflow, <b>84 des 97</b> merge requests fusionnées contiennent mes commits."),
  code:["g:guard"]}],

 /* ---------- Services & tools ---------- */
 svcIntro:X("Beyond the main application: services that keep secrets out of config, speed up onboarding and connect the platform to Windows workstations.","Au-delà de l'application principale : des services qui sortent les secrets de la configuration, accélèrent l'arrivée des développeurs et relient la plateforme aux postes Windows."),
 go:{d:X("Go · Oct 2026 · ~7,900 lines, 18 test files","Go · oct. 2026 · ~7 900 lignes, 18 fichiers de test"),h:X("Database credential bridge","Passerelle d'identifiants de bases de données"),
  p:X("Applications connect to a loopback port with a local password; the bridge logs in to the real database with credentials it keeps encrypted, then passes traffic through. The real host, user and password never appear in application config.","Les applications se connectent à un port local avec un mot de passe local ; la passerelle s'authentifie auprès de la vraie base avec des identifiants qu'elle garde chiffrés, puis relaie le trafic. L'hôte, l'utilisateur et le mot de passe réels n'apparaissent jamais dans la configuration."),

  [X("PHP + Bash · Oct 2026","PHP + Bash · oct. 2026"),X("MTA operations toolbox","Boîte à outils d'exploitation MTA"),X(["Refactored the team's PowerMTA operations CLI: one class per action, self-declared argument rules, SSH options defined once, a shared JSON reader.","Copy-and-fill templates for new actions, a regression check for every command and instructions for AI assistants."],["Refonte de l'outil CLI d'exploitation PowerMTA de l'équipe : une classe par action, règles d'arguments déclarées par l'action, options SSH définies une fois, lecteur JSON partagé.","Modèles à copier pour les nouvelles actions, test de non-régression par commande et instructions pour les assistants IA."])],
  [X("C# · .NET 4.7.2 · 2023 – 2024","C# · .NET 4.7.2 · 2023 – 2024"),X("Three Windows services","Trois services Windows"),X(["<b>Automation agent:</b> local HTTP API that hands out work items, records results and posts them every 100–130 s with jitter so a fleet never posts in the same second; AES-encrypted local files.","<b>Workstation identity:</b> reports PC name, MAC, CPU, RAM and disk on a loopback address, encrypted and bound to the login session, for device-bound login.","<b>Second-generation agent:</b> command execution and performance counters."],["<b>Agent d'automatisation :</b> API HTTP locale qui distribue les tâches, enregistre les résultats et les envoie toutes les 100–130 s avec gigue pour qu'une flotte n'envoie jamais à la même seconde ; fichiers locaux chiffrés AES.","<b>Identité du poste :</b> publie nom, MAC, CPU, RAM et disque du PC sur une adresse locale, chiffrés et liés à la session, pour la connexion liée au poste.","<b>Agent de deuxième génération :</b> exécution de commandes et compteurs de performance."]),"g:reporter"],
  [X("Java 7 · 2017 – 2018 · side project","Java 7 · 2017 – 2018 · projet personnel"),X("A PowerMTA alternative in Java","Une alternative à PowerMTA en Java"),X(["SMTP over raw sockets with every reply code checked; each connection bound to a configured source IP, like PowerMTA's virtual MTAs.","A thread pool per job with throttling delays, a streaming JSON reader for large recipient files and a watch-folder service; about 3,200 lines in 33 files."],["SMTP sur sockets bruts avec vérification de chaque code de réponse ; chaque connexion liée à une IP source configurée, comme les MTA virtuels de PowerMTA.","Un pool de threads par tâche avec délais de throttling, lecture JSON en flux pour les gros fichiers de destinataires et service de dossier surveillé ; environ 3 200 lignes en 33 fichiers."]),"g:smtp"],
  [X("PHP · 2023 · side project","PHP · 2023 · projet personnel"),X("zcrypt: a cipher written before I knew the word","zcrypt : un chiffrement écrit avant d'en connaître le nom"),X(["Turns readable numeric ids in public links into opaque strings; learning cryptography later showed it is a homophonic substitution cipher.","It hides ids rather than encrypting them in the modern sense — the credential bridge I wrote later uses AES-GCM."],["Transforme les identifiants numériques lisibles des liens publics en chaînes opaques ; l'étude de la cryptographie m'a appris plus tard qu'il s'agit d'un chiffrement par substitution homophonique.","Il masque les identifiants sans les chiffrer au sens moderne — la passerelle d'identifiants écrite ensuite utilise AES-GCM."]),"g:cipher"]],

const tr=o=>o==null?"":(typeof o==="object"&&!Array.isArray(o)&&("en" in o))?o[L]:o;
const num=v=>L==="fr"?String(v).replace(".",","):String(v);
const fmtK=s=>L==="fr"?s.replace(/(\d),(\d{3})/g,"$1 $2").replace(/(\d)\.(\d)/g,"$1,$2"):s;
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const U=k=>tr(T.ui[k]);

function hl(code,lang){
 const cm={sql:"--",php:"//",go:"//",csharp:"//",java:"//",bash:"#",ini:";",json:null,javascript:"//"}[lang]??"//";
 return code.split("\n").map(line=>{
  const e=esc(line);
  if(!cm)return e;
  const t=line.trimStart();
  if(t.startsWith(cm)||t.startsWith("/*")||t.startsWith("*")||(lang==="php"&&t.startsWith("#")))return `<span class="c">${e}</span>`;
  const i=line.indexOf(" "+cm+" ");
  if(i>0&&lang!=="bash")return esc(line.slice(0,i+1))+`<span class="c">${esc(line.slice(i+1))}</span>`;
  return e}).join("\n")}
const LN={sql:"SQL",php:"PHP · Laravel",go:"Go",csharp:"C#",java:"Java",bash:"Bash"};
function codeBlock(k){const m=CODE.meta[k],c=CODE.code[k];
 return `<div class="code fo"><div class="ch"><b>${esc(m.title)}</b><span>${LN[m.lang]||m.lang}</span></div><pre><code>${hl(c.replace(/\n+$/,""),m.lang)}</code></pre></div>`}

function chart(){
 const max=Math.max(...CHART.b),q=tr(CHART.q),pct=v=>Math.max(.4,v/max*100);
 const s=v=>num(v.toFixed(2))+" s";
 const rows=q.map((name,i)=>{const b=CHART.b[i],a=CHART.a[i],x=(b/a).toFixed(0);
  return `<div class="crow"><div class="q">${name}</div><div class="bars">
   <div class="br"><div class="m" style="width:${pct(b)}%;background:var(--before)"></div><span class="v">${s(b)}</span><span class="tip">${tr(CHART.lb)}: ${s(b)}</span></div>
   <div class="br a"><div class="m" style="width:${pct(a)}%;background:var(--after)"></div><span class="v">${s(a)} · ${x}×</span><span class="tip">${tr(CHART.la)}: ${s(a)}</span></div></div></div>`}).join("");
 const tbl=`<details class="fo"><summary>${U("showNum")}</summary><div class="tw"><table><tr><th></th>${tr(CHART.cols).map(c=>`<th class="n">${c}</th>`).join("")}</tr>${q.map((n,i)=>`<tr><td>${n}</td>${CHART.full[i].map(v=>`<td class="n">${v==null?tr(CHART.nf):s(v)}</td>`).join("")}</tr>`).join("")}</table></div></details>`;
 return `<div class="chart"><h4>${tr(CHART.title)}</h4><p class="sub">${tr(CHART.sub)}</p><div class="legend"><span><i style="background:var(--before)"></i>${tr(CHART.lb)}</span><span><i style="background:var(--after)"></i>${tr(CHART.la)}</span></div>${rows}${tbl}</div>`}

function caseHTML(c){
 const steps=c.steps?`<div class="steps fo">${c.steps.map((s,i)=>`<div class="step${i===c.steps.length-1?" cur":""}"><div class="sd">${fmtDate(s[0])}</div><h4>${tr(s[1])}</h4><p>${tr(s[2])}</p></div>`).join("")}</div>`:"";
 const bul=c.bullets?`<ul class="fo">${tr(c.bullets).map(b=>`<li>${fmtK(b)}</li>`).join("")}</ul>`:"";
 const tbl=c.table?`<div class="tw"><table><tr>${tr(c.table.head).map(h=>`<th>${h}</th>`).join("")}</tr>${tr(c.table.rows).map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</table></div>`:"";
 const more=c.more?`<details class="fo"><summary>${U("moreCode")}</summary>${c.more.map(codeBlock).join("")}</details>`:"";
 return `<article class="cs" id="cs-${c.id}"><div class="k">${U("cs")} · ${tr(c.k)}</div><h3>${tr(c.h)}</h3><p>${tr(c.p)}</p>
  <div class="stack">${c.stack.map(s=>`<span>${s}</span>`).join("")}</div>
  <div class="result"><b>${U("result")} —</b> ${fmtK(tr(c.result))}</div>
  ${c.chart?chart():""}${tbl}${steps}${bul}${(c.code||[]).map(codeBlock).join("")}${more}</article>`}

 document.title=`Zakaria Sidi Ammi – ${L==="fr"?"Portfolio":"Portfolio"}${V==="short"?(L==="fr"?" (synthèse)":" (summary)"):""}`;
 try{localStorage.setItem("zsa-portfolio",JSON.stringify({L,V}))}catch(e){}

/* Highlight current section in the sidebar nav */
let obs;
function spy(){
 if(obs)obs.disconnect();
 if(!("IntersectionObserver" in window))return;
 obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("cur",a.dataset.id===e.target.id))}}),{rootMargin:"-20% 0px -70% 0px"});
 document.querySelectorAll("#top,h2[id]").forEach(el=>obs.observe(el));
}

document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{if(b.dataset.l)L=b.dataset.l;else V=b.dataset.v;render()});
render();
</script>
